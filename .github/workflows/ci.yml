name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Game data is never in the repository, so these checks use the unit tests' small built-in
# fixtures; the importer's disc checks are skipped without DIGIATLAS_PS2_ISO.
jobs:
  interface:
    name: Interface (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:format
      - run: npm run build
      - run: npm test

  importer:
    name: Importer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: importer
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  native:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Tauri 2 Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The native build embeds the built interface.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # src-tauri may depend on ../importer by path; its build output lands in src-tauri/target.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Check the backend and build the actual desktop executable on each platform.
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop executable
        run: npm run tauri -- build --ci --no-bundle
      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: digiatlas-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/digiatlas
            src-tauri/target/release/digiatlas.exe
            src-tauri/target/release/bundle/macos/DigiAtlas.app
          if-no-files-found: error
          retention-days: 14
