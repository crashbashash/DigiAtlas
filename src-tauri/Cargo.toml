[package]
name = "digiatlas"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
[features]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
digiatlas-importer = { path = "../importer" }

# The importer walks every byte of the disc; unoptimised it would take many minutes in debug builds.
[profile.dev.package.digiatlas-importer]
opt-level = 2
